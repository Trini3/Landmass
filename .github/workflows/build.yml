name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and server test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: acclimatization-jar
          path: build/libs/*.jar

      # Starts a dedicated server on a default world whose folder already has the Custom Climate file
      # (an empty {} means the default settings), then checks the climate was applied to the overworld only.
      - name: Server test
        timeout-minutes: 15
        run: |
          mkdir -p run/world/serverconfig
          # The server only runs once the Minecraft EULA is accepted.
          echo "eula=true" > run/eula.txt
          echo "{}" > run/world/serverconfig/acclimatization.json
          printf "level-seed=20261117\nonline-mode=false\nmax-tick-time=-1\n" > run/server.properties
          ./gradlew runServer --stacktrace > server-console.txt 2>&1 &
          GRADLE_PID=$!
          for i in $(seq 1 120); do
            grep -qs "Done (" run/logs/latest.log && break
            kill -0 $GRADLE_PID 2>/dev/null || break
            sleep 5
          done
          # SIGTERM makes Minecraft save and shut down cleanly.
          pkill -TERM -f devlaunchinjector || true
          wait $GRADLE_PID || true
          tail -n 40 server-console.txt
          grep -q "Done (" run/logs/latest.log
          grep -q "Applying Custom Climate to the overworld" run/logs/latest.log
          test "$(grep -c "Applying Custom Climate" run/logs/latest.log)" = "1"
          ! grep -q "Exception" run/logs/latest.log

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          if-no-files-found: ignore
          path: |
            run/logs/latest.log
            server-console.txt
